; Asterisk as the customer's PBX in **lines** mode (SPEC §6 item 3c): the
; light server registers one third-party SIP line per device instead of
; being an IP-trusted trunk peer. Used when the image is built with
; ASTERISK_LINES=yes, replacing pjsip.conf wholesale.
;
; Why a whole separate file and not a patch on the trunk one: the trunk's
; `type=identify` section is exactly what must NOT be here. pjsip matches an
; inbound request by source address before it tries the From user, so with
; the trunk's identify in place every INVITE our registered lines send would
; be attributed to the trunk endpoint and the registrations would count for
; nothing. That is the same collision CUCM has, and the reason -pbx-mode is
; one mode or the other rather than both.

[transport-udp]
type=transport
tos=cs3
cos=3
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
tos=cs3
cos=3
protocol=tcp
bind=0.0.0.0:5060

; ---- desk phone 100 --------------------------------------------------------
; Unchanged from the trunk bench: the far side of every call here.
[100]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-phones
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[100]
type=auth
auth_type=userpass
username=100
password=harness

[100]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=5
qualify_timeout=3.0
remove_unavailable=yes

; ---- the light server's lines ----------------------------------------------
; One endpoint per device, each with its own credential, each reached at
; whatever contact its REGISTER advertised. This is the shape a third-party
; SIP device takes on any exchange: a directory number, a digest user, and
; a registration.
;
; `auth=` on the endpoint also makes Asterisk challenge the INVITEs that
; come *from* it, which is the other half of the credential path and the
; one a trunk never exercises — CUCM challenges line-side INVITEs too.
;
; `rewrite_contact=no` on purpose: the trunk bench needs the rewrite because
; a phone behind NAT lies about its address, but here the point is to prove
; the Contact this server puts in its REGISTER is one the PBX can actually
; call back. Rewriting it would paper over a wrong one.

; 201 is the real app's device (dev-a). It is here so that provision.sh can
; seed one set of line credentials for both benches — the same ones the
; native PBX uses (harness/asterisk-native/pjsip-lines.conf) — rather than
; the two drifting apart. The scenarios assert 211 and 212; this one simply
; makes it three registrations rather than two.
[201]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-lines
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=201-line
aors=201
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no

[201-line]
type=auth
auth_type=userpass
username=line201
password=dialpark-line-201

[201]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=5
qualify_timeout=3.0
remove_unavailable=yes

[211]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-lines
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=211-line
aors=211
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
; A mailbox makes the exchange send this line an unsolicited
; message-summary NOTIFY (RFC 3842) when its contact registers — what CUCM
; does on every REGISTER — which the server must answer 200 (it answered
; 400 on the 2026-10-17 CUCM bench). voicemail.conf holds the mailbox.
mailboxes=211@default

[211-line]
type=auth
auth_type=userpass
username=line211
password=linepass-211

[211]
type=aor
max_contacts=1
remove_existing=yes
; The exchange polls a registered line and drops a contact that stops
; answering, exactly as it does a desk phone. Our trunk listener answers
; OPTIONS, so this also proves that end of it.
qualify_frequency=5
qualify_timeout=3.0
remove_unavailable=yes

[212]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-lines
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=212-line
aors=212
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
; A mailbox makes the exchange send this line an unsolicited
; message-summary NOTIFY (RFC 3842) when its contact registers — what CUCM
; does on every REGISTER — which the server must answer 200 (it answered
; 400 on the 2026-10-17 CUCM bench). voicemail.conf holds the mailbox.
mailboxes=212@default

[212-line]
type=auth
auth_type=userpass
username=line212
password=linepass-212

[212]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=5
qualify_timeout=3.0
remove_unavailable=yes
