; Dial plan for the harness PBX in lines mode (SPEC §6 item 3c).
;   from-phones: desk phone 100 dials 2XX → the registered line, direct
;   from-lines:  a line dials 100 / 600 / 700 / 701
;
; The difference from the trunk plan is one word per Dial: PJSIP/211 is a
; registered device the exchange knows, where PJSIP/211@dialpark was a peer
; it forwarded to. That is the whole point of the mode.

[general]
static=yes
writeprotect=yes

; ---- Dial's outcome → the SIP status the caller should hear ----------------
; As on the trunk bench: without it a failed Dial says nothing and the
; caller cannot tell "nobody home" from "still ringing".
[dial-status]
exten => status-CHANUNAVAIL,1,NoOp(${DEST}: no reachable contact)
 same => n,Hangup(20)                  ; subscriber absent  → 480
exten => status-NOANSWER,1,NoOp(${DEST}: rang out)
 same => n,Hangup(19)                  ; no answer          → 480
exten => status-BUSY,1,NoOp(${DEST}: busy)
 same => n,Hangup(17)                  ; user busy          → 486
exten => status-CONGESTION,1,NoOp(${DEST}: congested)
 same => n,Hangup(34)                  ; circuit congestion → 503
exten => _status-.,1,Hangup()

[from-phones]
include => dial-status
exten => _2XX,1,NoOp(Desk phone → line ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

; DTMF bench (harness/dtmf_test.sh; SPEC §7.3 item 10 d): 811 reaches app
; 211 like 211 does, and once it answers the PBX sends it the digits 1 5 9
; as RFC 4733 events on the call (Dial's D option). The app must report
; each one.
exten => 811,1,NoOp(Desk phone → app 211, then digits 159 to it)
 same => n,Set(DEST=211)
 same => n,Dial(PJSIP/211,30,D(159))
 same => n,Goto(status-${DIALSTATUS},1)

[from-lines]
include => dial-status
exten => 100,1,NoOp(Line ${CALLERID(num)} → desk phone 100)
 same => n,Set(DEST=100)
 same => n,Dial(PJSIP/100,30)
 same => n,Goto(status-${DIALSTATUS},1)

; A line calling another line: the exchange bridges them, and the server
; sees two separate calls rather than one. Not what app↔app does — those
; stay local by design (SPEC §3) — but the exchange must still be able to.
exten => _2XX,1,NoOp(Line ${CALLERID(num)} → line ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

; 700 / 701 / 600 as on the trunk bench: a target that rings and gives up,
; one that refuses at once, and the PBX-side echo.
exten => 700,1,NoOp(Line → ring but never answer)
 same => n,Ringing()
 same => n,Wait(5)
 same => n,Hangup(19)

exten => 701,1,NoOp(Line → reject with busy)
 same => n,Hangup(17)

exten => 650,1,NoOp(DTMF bench: read three digits from the app)
 same => n,Answer()
 same => n,Read(DIGITS,,3,,1,10)
 same => n,NoOp(DTMF received: ${DIGITS})
 same => n,Wait(1)
 same => n,Hangup()

exten => 600,1,NoOp(Line → PBX echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
