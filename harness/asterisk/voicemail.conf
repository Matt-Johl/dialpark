; Mailboxes for the lines bench (pjsip-lines.conf `mailboxes=`): their only
; purpose is to make Asterisk send each registered line an unsolicited
; message-summary NOTIFY, as CUCM does on every REGISTER. Nothing leaves a
; message in them.
[general]
format=wav
maxmsg=10

[default]
211 => 1234,Line 211
212 => 1234,Line 212
