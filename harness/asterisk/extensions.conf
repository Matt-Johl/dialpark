; Dial plan for the harness PBX.
;   from-phones:  desk phone 100 dials 2XX → handed to the dialpark trunk
;   from-dialpark: dialpark sends 100 → rings the desk phone

[general]
static=yes
writeprotect=yes

; ---- Dial's outcome → the SIP status the caller should hear ----------------
; Included by every context that dials. Without it a failed Dial falls
; through to a bare Hangup(): Asterisk sends nothing that says why, the
; caller is left on the ring-back it was given when the call started, and
; "nobody home" cannot be told from "still ringing" (2026-09-15: calling a
; phone that was switched off rang until the caller gave up). The cause
; codes are what res_pjsip turns into a SIP response.
[dial-status]
exten => status-CHANUNAVAIL,1,NoOp(${DEST}: no reachable contact)
 same => n,Hangup(20)                  ; subscriber absent  → 480
exten => status-NOANSWER,1,NoOp(${DEST}: rang out)
 same => n,Hangup(19)                  ; no answer          → 480
exten => status-BUSY,1,NoOp(${DEST}: busy)
 same => n,Hangup(17)                  ; user busy          → 486
exten => status-CONGESTION,1,NoOp(${DEST}: congested)
 same => n,Hangup(34)                  ; circuit congestion → 503
; ANSWER (the call happened and ended) and anything else: ordinary hangup.
exten => _status-.,1,Hangup()

[from-phones]
include => dial-status
exten => _2XX,1,NoOp(Desk phone → Dialler user ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@dialpark,30)
 same => n,Goto(status-${DIALSTATUS},1)

; DTMF bench (harness/dtmf_test.sh; SPEC §7.3 item 10 d): 811 reaches app
; 211 like 211 does, and once it answers the PBX sends it the digits 1 5 9
; as RFC 4733 events on the call (Dial's D option). The app must report
; each one.
exten => 811,1,NoOp(Desk phone → app 211, then digits 159 to it)
 same => n,Set(DEST=211)
 same => n,Dial(PJSIP/211@dialpark,30,D(159))
 same => n,Goto(status-${DIALSTATUS},1)

[from-dialpark]
include => dial-status
exten => 100,1,NoOp(Dialler → desk phone 100)
 same => n,Set(DEST=100)
 same => n,Dial(PJSIP/100,30)
 same => n,Goto(status-${DIALSTATUS},1)

; 700: alerts for 5 s and never answers, then fails. A transfer target that
; takes a known, bounded time to fail, so the party waiting through the
; transfer can be recorded hearing hold music (harness/hold_music_test.sh).
exten => 700,1,NoOp(Dialler → ring but never answer)
 same => n,Ringing()
 same => n,Wait(5)
 same => n,Hangup(19)

; 701: rejects at once with busy. A transfer target that REFUSES, as
; opposed to 700 which rings and then gives up — the two are different
; answers and the transferor should be able to tell them apart.
exten => 701,1,NoOp(Dialler → reject with busy)
 same => n,Hangup(17)

; 650: the DTMF bench's reader — answer, take three digits as RFC 4733
; events, and say what they were (harness/dtmf_test.sh).
exten => 650,1,NoOp(DTMF bench: read three digits from the app)
 same => n,Answer()
 same => n,Read(DIGITS,,3,,1,10)
 same => n,NoOp(DTMF received: ${DIGITS})
 same => n,Wait(1)
 same => n,Hangup()

; 600: the PBX echoes the caller's audio back — the trunk-leg counterpart of
; the server's own "echo" destination (which needs no PBX at all).
exten => 600,1,NoOp(Dialler → PBX echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
